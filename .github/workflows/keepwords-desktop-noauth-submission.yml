name: KEEPWORDS Desktop NoAuth Submission

on:
  workflow_dispatch:
  push:
    branches:
      - feature/keepwords

jobs:
  verify-windows-desktop-noauth:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence-noauth -Force | Out-Null
          "submission_evidence_version=6" | Out-File evidence-noauth/manifest.txt -Encoding utf8
          "head_sha=$(git rev-parse HEAD)" | Out-File evidence-noauth/manifest.txt -Encoding utf8 -Append
          "branch=$(git branch --show-current)" | Out-File evidence-noauth/manifest.txt -Encoding utf8 -Append
          "production_build_tags=desktop,production" | Out-File evidence-noauth/manifest.txt -Encoding utf8 -Append
          "required=KEEPWORDS E2E + live public web + desktop no-auth backend + non-desktop auth invariant + exact EXE CLI + exact EXE no-auth API + exact EXE no-login UI + SHA256 identity" | Out-File evidence-noauth/manifest.txt -Encoding utf8 -Append

      - name: Apply KEEPWORDS source patch
        shell: pwsh
        run: |
          git apply --check .github/patches/keepwords.patch
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS patch check failed' }
          git apply .github/patches/keepwords.patch
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS patch apply failed' }

      - name: Apply r18.dev title-search source patch
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/title-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title-search patch check failed' }
          git apply --recount .github/patches/title-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title-search patch apply failed' }

      - name: Apply web-first title resolver hook
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/title-web-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title web-search patch check failed' }
          git apply --recount .github/patches/title-web-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title web-search patch apply failed' }

      - name: Apply unmatched-filename web-first handoff patch
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/worker-web-first.patch
          if ($LASTEXITCODE -ne 0) { throw 'worker web-first patch check failed' }
          git apply --recount .github/patches/worker-web-first.patch
          if ($LASTEXITCODE -ne 0) { throw 'worker web-first patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'source patches produced invalid diff' }

      - name: Capture applied source state
        shell: pwsh
        run: |
          git diff | Out-File evidence-noauth/applied-source.diff -Encoding utf8
          git status --short | Out-File evidence-noauth/git-status-after-patches.txt -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add GCC to PATH
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Record toolchain
        shell: pwsh
        run: |
          go version | Tee-Object -FilePath evidence-noauth/toolchain.txt
          node --version | Tee-Object -FilePath evidence-noauth/toolchain.txt -Append
          npm --version | Tee-Object -FilePath evidence-noauth/toolchain.txt -Append
          gcc --version | Select-Object -First 1 | Tee-Object -FilePath evidence-noauth/toolchain.txt -Append
          go env GOOS GOARCH CGO_ENABLED | Tee-Object -FilePath evidence-noauth/toolchain.txt -Append

      - name: Format patched Go sources
        shell: pwsh
        run: |
          gofmt -w internal/scrape/scrape.go internal/scrape/title_web_search.go internal/scrape/keepwords_search_noise.go internal/scrape/title_web_search_keepwords_test.go internal/scrape/keepwords_search_noise_test.go internal/scrape/title_web_search_live_contract_test.go internal/worker/scrape_phase.go internal/worker/web_first_keepwords_test.go internal/worker/keepwords_submission_e2e_test.go internal/r18devdump/store.go internal/r18devdump/import.go internal/api/auth/desktop_local_auth_desktop.go internal/api/auth/desktop_local_auth_other.go internal/api/auth/desktop_local_noauth_test.go internal/api/auth/desktop_local_auth_other_test.go internal/api/auth/middleware.go internal/api/auth/session.go
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'gofmt/diff check failed' }

      - name: Prove desktop localhost bypass boundary
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production' ./internal/api/auth -run '^TestDesktopLocalNoAuth_' -count=1 2>&1 | Tee-Object -FilePath evidence-noauth/desktop-noauth-backend.txt
          if ($LASTEXITCODE -ne 0) { throw 'desktop localhost no-auth backend tests failed' }

      - name: Prove non-desktop auth remains required
        shell: pwsh
        run: |
          go test -v -tags 'production' ./internal/api/auth -run '^(TestNonDesktopLoopbackStillRequiresAuth|TestAuthManager_DoesNotSatisfyAuthDisabler)$' -count=1 2>&1 | Tee-Object -FilePath evidence-noauth/non-desktop-auth-invariant.txt
          if ($LASTEXITCODE -ne 0) { throw 'non-desktop authentication invariant failed' }

      - name: Test KEEPWORDS template
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,keepwords' ./internal/template -run 'KeepWords' -count=1 2>&1 | Tee-Object -FilePath evidence-noauth/template-keepwords.txt
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS template tests failed' }

      - name: Test deterministic worker-to-web-to-scraper E2E
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,submissione2e' ./internal/worker -run '^TestSubmissionE2E_UnmatchedFilenameKeepWordsToResolvedCatalogID$' -count=1 2>&1 | Tee-Object -FilePath evidence-noauth/deterministic-e2e.txt
          if ($LASTEXITCODE -ne 0) { throw 'deterministic worker E2E failed' }

      - name: Test existing web-first regressions
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,keepwords' ./internal/scrape ./internal/r18devdump ./internal/scraper/r18dev -count=1 2>&1 | Tee-Object -FilePath evidence-noauth/regression-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'web-first regression tests failed' }

      - name: Test live public-web title resolution
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,submissionlive' ./internal/scrape -run '^TestSubmissionLiveTitleToCatalogID$' -count=1 -timeout 90s 2>&1 | Tee-Object -FilePath evidence-noauth/live-web-contract.txt
          if ($LASTEXITCODE -ne 0) { throw 'LIVE title-to-catalog-ID contract failed' }

      - name: Install frontend dependencies
        shell: pwsh
        working-directory: web/frontend
        run: npm ci

      - name: Install Playwright Chromium
        shell: pwsh
        working-directory: web/frontend
        run: npx playwright install chromium

      - name: Build frontend
        shell: pwsh
        working-directory: web/frontend
        run: npm run build

      - name: Stage embedded frontend
        shell: pwsh
        run: |
          if (Test-Path 'web/dist') { Remove-Item 'web/dist' -Recurse -Force }
          New-Item -ItemType Directory -Path 'web/dist' -Force | Out-Null
          Copy-Item 'web/frontend/build/*' 'web/dist' -Recurse -Force

      - name: Generate Windows icon resource
        shell: pwsh
        run: go run ./internal/desktop/icons/genicon -ico internal/desktop/icons/javinizer.ico -o cmd/javinizer/javinizer.syso -arch amd64

      - name: Build exact Windows desktop executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $commit = git rev-parse --short HEAD
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          go build -trimpath -tags 'desktop,production' -ldflags "-w -s -H windowsgui -X github.com/javinizer/javinizer-go/internal/version.Version=keepwords-noauth -X github.com/javinizer/javinizer-go/internal/version.Commit=$commit -X github.com/javinizer/javinizer-go/internal/version.BuildDate=$buildDate -X github.com/javinizer/javinizer-go/internal/desktop.BuildDesktop=1" -o 'dist/Javinizer-KEEPWORDS-NoAuth.exe' ./cmd/javinizer
          if ($LASTEXITCODE -ne 0) { throw 'Windows desktop build failed' }

      - name: Submission blackbox exact EXE no-auth API and UI
        shell: pwsh
        run: |
          & ./.github/scripts/verify_keepwords_desktop_noauth_windows_blackbox.ps1 -ExePath 'dist/Javinizer-KEEPWORDS-NoAuth.exe' -EvidenceDir 'evidence-noauth'
          $summaryPath = 'evidence-noauth/blackbox-summary.txt'
          if (-not (Test-Path $summaryPath)) { throw 'blackbox summary missing' }
          $summary = Get-Content $summaryPath -Raw
          foreach ($required in @(
            'blackbox_verification=PASS',
            'gate_a=PASS',
            'gate_b=PASS',
            'gate_b_auth_mode=desktop_local_noauth',
            'gate_c_ui=PASS',
            'auth_setup_called=false',
            'auth_login_called=false',
            'session_header_used=false',
            'auth_credentials_file_created=false',
            'auth_sessions_file_created=false',
            'expected_catalog_id=SSIS-001',
            'tested_exe_sha256='
          )) {
            if ($summary.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) {
              throw "blackbox summary missing proof: $required"
            }
          }
          Get-Content $summaryPath

      - name: Verify tested EXE equals distributable EXE
        shell: pwsh
        run: |
          $actual = (Get-FileHash 'dist/Javinizer-KEEPWORDS-NoAuth.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          $testedLine = Get-Content 'evidence-noauth/blackbox-summary.txt' | Where-Object { $_ -match '^tested_exe_sha256=' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($testedLine)) { throw 'tested_exe_sha256 missing' }
          $tested = ($testedLine -replace '^tested_exe_sha256=', '').Trim().ToLowerInvariant()
          if ($tested -notmatch '^[0-9a-f]{64}$') { throw "invalid tested hash: $tested" }
          if ($actual -ne $tested) { throw "tested/distributable EXE mismatch: tested=$tested actual=$actual" }
          $item = Get-Item 'dist/Javinizer-KEEPWORDS-NoAuth.exe'
          @(
            "exe_name=$($item.Name)",
            "exe_bytes=$($item.Length)",
            "blackbox_tested_exe_sha256=$tested",
            "exe_sha256=$actual",
            "sha256_identity=PASS",
            "verified_head_sha=$(git rev-parse HEAD)"
          ) | Out-File evidence-noauth/executable.txt -Encoding utf8
          Get-Content evidence-noauth/executable.txt

      - name: Mark distribution eligible
        shell: pwsh
        run: |
          @(
            'verification_result=PASS',
            'desktop_login_required=false',
            'desktop_localhost_auth_mode=automatic_local',
            'desktop_auth_files_created=false',
            'non_desktop_auth_required=true',
            'keepwords_webfirst=PASS',
            'exact_exe_cli=PASS',
            'exact_exe_api_noauth=PASS',
            'exact_exe_ui_no_login=PASS',
            'sha256_identity=PASS',
            'distribution_eligible=true'
          ) | Out-File evidence-noauth/result.txt -Encoding utf8

      - name: Upload verified Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Javinizer-KEEPWORDS-NoAuth-Windows
          path: dist/Javinizer-KEEPWORDS-NoAuth.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Javinizer-KEEPWORDS-NoAuth-verification-evidence
          path: evidence-noauth/
          if-no-files-found: warn
          retention-days: 14
