name: KEEPWORDS Windows Build

on:
  workflow_dispatch:
  push:
    branches:
      - feature/keepwords

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create evidence directory
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          "submission_evidence_version=6" | Out-File evidence/manifest.txt -Encoding utf8
          "head_sha=$(git rev-parse HEAD)" | Out-File evidence/manifest.txt -Encoding utf8 -Append
          "branch=$(git branch --show-current)" | Out-File evidence/manifest.txt -Encoding utf8 -Append
          "production_build_tags=desktop,production" | Out-File evidence/manifest.txt -Encoding utf8 -Append
          "distribution_gate=live web + deterministic E2E + exact built EXE CLI blackbox + exact built EXE authenticated API filename blackbox + exact built EXE desktop-local no-auth blackbox + security invariants + tested/distributed EXE SHA256 identity" | Out-File evidence/manifest.txt -Encoding utf8 -Append

      - name: Apply KEEPWORDS source patch
        shell: pwsh
        run: |
          git apply --check .github/patches/keepwords.patch
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS patch check failed' }
          git apply .github/patches/keepwords.patch
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS patch produced invalid diff' }

      - name: Apply r18.dev title-search source patch
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/title-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title-search patch check failed' }
          git apply --recount .github/patches/title-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title-search patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'title-search patch produced invalid diff' }

      - name: Apply web-first title resolver hook
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/title-web-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title web-search patch check failed' }
          git apply --recount .github/patches/title-web-search.patch
          if ($LASTEXITCODE -ne 0) { throw 'title web-search patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'title web-search patch produced invalid diff' }

      - name: Apply unmatched-filename web-first handoff patch
        shell: pwsh
        run: |
          git apply --recount --check .github/patches/worker-web-first.patch
          if ($LASTEXITCODE -ne 0) { throw 'worker web-first patch check failed' }
          git apply --recount .github/patches/worker-web-first.patch
          if ($LASTEXITCODE -ne 0) { throw 'worker web-first patch apply failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'worker web-first patch produced invalid diff' }

      - name: Capture applied source diff
        shell: pwsh
        run: |
          git diff -- internal/template/engine.go internal/scrape internal/worker/scrape_phase.go | Out-File evidence/applied-source.diff -Encoding utf8
          git status --short | Out-File evidence/git-status-after-patches.txt -Encoding utf8

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/frontend/package-lock.json

      - name: Install MSYS2 UCRT64 toolchain
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc

      - name: Add GCC to PATH
        shell: pwsh
        run: |
          'C:\msys64\ucrt64\bin' | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          'CC=gcc' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'CGO_ENABLED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify and record toolchain
        shell: pwsh
        run: |
          go version | Tee-Object -FilePath evidence/toolchain.txt
          node --version | Tee-Object -FilePath evidence/toolchain.txt -Append
          npm --version | Tee-Object -FilePath evidence/toolchain.txt -Append
          gcc --version | Select-Object -First 1 | Tee-Object -FilePath evidence/toolchain.txt -Append
          go env GOOS GOARCH CGO_ENABLED | Tee-Object -FilePath evidence/toolchain.txt -Append

      - name: Format patched Go sources and submission tests
        shell: pwsh
        run: |
          $scrapeGoFiles = Get-ChildItem internal/scrape -Filter '*.go' | ForEach-Object { $_.FullName }
          gofmt -w $scrapeGoFiles internal/worker/scrape_phase.go internal/worker/web_first_keepwords_test.go internal/worker/keepwords_submission_e2e_test.go internal/r18devdump/store.go internal/r18devdump/import.go
          if ($LASTEXITCODE -ne 0) { throw 'gofmt failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'gofmt produced invalid diff' }

      - name: Prove submission tags do not alter production source
        shell: pwsh
        run: |
          $hits = Get-ChildItem internal -Recurse -Filter '*.go' | Where-Object { $_.Name -notlike '*_test.go' } | Select-String -Pattern '//go:build.*(submissione2e|submissionlive|keepwords)'
          if ($hits) {
            $hits | Tee-Object -FilePath evidence/forbidden-feature-source-tags.txt
            throw 'feature/submission build tag found on non-test production source'
          }
          'PASS: submissione2e/submissionlive/keepwords tags only add tests; production source set is unchanged.' | Out-File evidence/source-tag-proof.txt -Encoding utf8

      - name: Test desktop localhost no-auth security invariants
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production' ./internal/api/auth -run '^(TestDesktopLocalNoAuth_|TestAuthManager_DoesNotSatisfyAuthDisabler)' -count=1 2>&1 | Tee-Object -FilePath evidence/desktop-local-noauth-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'desktop localhost no-auth security invariant tests failed' }

      - name: Test non-desktop loopback still requires authentication
        shell: pwsh
        run: |
          go test -v ./internal/api/auth -run '^TestNonDesktopLoopbackStillRequiresAuth$' -count=1 2>&1 | Tee-Object -FilePath evidence/non-desktop-auth-required.txt
          if ($LASTEXITCODE -ne 0) { throw 'non-desktop loopback authentication invariant failed' }

      - name: Test KEEPWORDS template under production source tags
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,keepwords' ./internal/template -run 'KeepWords' -count=1 2>&1 | Tee-Object -FilePath evidence/template-keepwords.txt
          if ($LASTEXITCODE -ne 0) { throw 'KEEPWORDS template test failed' }

      - name: Test deterministic worker-to-web-to-scraper E2E
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,submissione2e' ./internal/worker -run '^TestSubmissionE2E_UnmatchedFilenameKeepWordsToResolvedCatalogID$' -count=1 2>&1 | Tee-Object -FilePath evidence/deterministic-e2e.txt
          if ($LASTEXITCODE -ne 0) { throw 'submission deterministic E2E failed' }

      - name: Test existing web-first regressions under production source tags
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,keepwords' ./internal/scrape ./internal/r18devdump ./internal/scraper/r18dev -count=1 2>&1 | Tee-Object -FilePath evidence/regression-tests.txt
          if ($LASTEXITCODE -ne 0) { throw 'web-first regression tests failed' }

      - name: Test live public-web title resolution
        shell: pwsh
        run: |
          go test -v -tags 'desktop,production,submissionlive' ./internal/scrape -run '^TestSubmissionLiveTitleToCatalogID$' -count=1 -timeout 90s 2>&1 | Tee-Object -FilePath evidence/live-web-contract.txt
          if ($LASTEXITCODE -ne 0) { throw 'LIVE web title-to-catalog-ID contract failed; do not distribute this build' }

      - name: Install frontend dependencies
        shell: pwsh
        run: npm ci
        working-directory: web/frontend

      - name: Build frontend
        shell: pwsh
        run: npm run build
        working-directory: web/frontend

      - name: Stage embedded frontend
        shell: pwsh
        run: |
          if (Test-Path 'web/dist') { Remove-Item 'web/dist' -Recurse -Force }
          New-Item -ItemType Directory -Path 'web/dist' -Force | Out-Null
          Copy-Item 'web/frontend/build/*' 'web/dist' -Recurse -Force

      - name: Generate Windows icon resource
        shell: pwsh
        run: go run ./internal/desktop/icons/genicon -ico internal/desktop/icons/javinizer.ico -o cmd/javinizer/javinizer.syso -arch amd64

      - name: Build Windows desktop executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $commit = git rev-parse --short HEAD
          $buildDate = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
          go build -trimpath -tags 'desktop,production' -ldflags "-w -s -H windowsgui -X github.com/javinizer/javinizer-go/internal/version.Version=keepwords-webtitle -X github.com/javinizer/javinizer-go/internal/version.Commit=$commit -X github.com/javinizer/javinizer-go/internal/version.BuildDate=$buildDate -X github.com/javinizer/javinizer-go/internal/desktop.BuildDesktop=1" -o 'dist/Javinizer-KEEPWORDS.exe' ./cmd/javinizer

      - name: Black-box verify exact built EXE via CLI and authenticated API filename path
        shell: pwsh
        run: |
          & ./.github/scripts/verify_keepwords_windows_blackbox.ps1 -ExePath 'dist/Javinizer-KEEPWORDS.exe' -EvidenceDir 'evidence'
          $summaryPath = 'evidence/blackbox-summary.txt'
          if (-not (Test-Path $summaryPath)) { throw 'black-box verifier did not produce summary evidence' }
          $summary = Get-Content $summaryPath -Raw
          foreach ($required in @('blackbox_verification=PASS', 'gate_a=PASS', 'gate_b=PASS', 'expected_catalog_id=SSIS-001', 'tested_exe_sha256=')) {
            if ($summary.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) {
              throw "black-box summary missing required proof: $required"
            }
          }
          Get-Content $summaryPath

      - name: Gate C exact built EXE desktop localhost without login
        shell: pwsh
        run: |
          & ./.github/scripts/verify_desktop_noauth_blackbox.ps1 -ExePath 'dist/Javinizer-KEEPWORDS.exe' -EvidenceDir 'evidence'
          $gateCPath = 'evidence/desktop-noauth/result.txt'
          if (-not (Test-Path $gateCPath)) { throw 'desktop no-auth verifier did not produce result evidence' }
          $gateC = Get-Content $gateCPath -Raw
          foreach ($required in @(
            'gate_c_result=PASS',
            'auth_credentials_preexisting=false',
            'auth_sessions_preexisting=false',
            'auth_setup_called=false',
            'auth_login_called=false',
            'session_header_sent=false',
            'authorization_header_sent=false',
            'cookie_session_sent=false',
            'auth_status_initialized=True',
            'auth_status_authenticated=True',
            'auth_status_username=local',
            'auth_status_session_id_empty=True',
            'auth_credentials_created=false',
            'auth_sessions_created=false',
            'protected_batch_without_auth=PASS',
            'movie_id=SSIS-001',
            'tested_exe_sha256='
          )) {
            if ($gateC.IndexOf($required, [System.StringComparison]::Ordinal) -lt 0) {
              throw "Gate C evidence missing required proof: $required"
            }
          }
          Get-Content $gateCPath

      - name: Verify executable hash equals all black-box-tested executables
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Javinizer-KEEPWORDS.exe')) { throw 'Javinizer-KEEPWORDS.exe was not created' }
          if (-not (Test-Path 'evidence/blackbox-summary.txt')) { throw 'Gate A/B black-box summary evidence is missing' }
          if (-not (Test-Path 'evidence/desktop-noauth/result.txt')) { throw 'Gate C black-box evidence is missing' }

          $actualHash = (Get-FileHash 'dist/Javinizer-KEEPWORDS.exe' -Algorithm SHA256).Hash.ToLowerInvariant()

          $abHashLine = Get-Content 'evidence/blackbox-summary.txt' | Where-Object { $_ -match '^tested_exe_sha256=' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($abHashLine)) { throw 'Gate A/B tested_exe_sha256 is missing' }
          $abHash = ($abHashLine -replace '^tested_exe_sha256=', '').Trim().ToLowerInvariant()

          $cHashLine = Get-Content 'evidence/desktop-noauth/result.txt' | Where-Object { $_ -match '^tested_exe_sha256=' } | Select-Object -First 1
          if ([string]::IsNullOrWhiteSpace($cHashLine)) { throw 'Gate C tested_exe_sha256 is missing' }
          $cHash = ($cHashLine -replace '^tested_exe_sha256=', '').Trim().ToLowerInvariant()

          foreach ($value in @($actualHash, $abHash, $cHash)) {
            if ($value -notmatch '^[0-9a-f]{64}$') { throw "invalid SHA256 value: $value" }
          }
          if ($actualHash -ne $abHash) { throw "EXE identity mismatch: Gate A/B=$abHash current=$actualHash" }
          if ($actualHash -ne $cHash) { throw "EXE identity mismatch: Gate C=$cHash current=$actualHash" }

          $item = Get-Item 'dist/Javinizer-KEEPWORDS.exe'
          "exe_name=$($item.Name)" | Out-File evidence/executable.txt -Encoding utf8
          "exe_bytes=$($item.Length)" | Out-File evidence/executable.txt -Encoding utf8 -Append
          "gate_ab_tested_exe_sha256=$abHash" | Out-File evidence/executable.txt -Encoding utf8 -Append
          "gate_c_tested_exe_sha256=$cHash" | Out-File evidence/executable.txt -Encoding utf8 -Append
          "exe_sha256=$actualHash" | Out-File evidence/executable.txt -Encoding utf8 -Append
          "sha256_identity=PASS" | Out-File evidence/executable.txt -Encoding utf8 -Append
          "verified_head_sha=$(git rev-parse HEAD)" | Out-File evidence/executable.txt -Encoding utf8 -Append
          Get-Content evidence/executable.txt

      - name: Mark submission verification complete
        shell: pwsh
        run: |
          'verification_result=PASS' | Out-File evidence/result.txt -Encoding utf8
          'gate_a=PASS' | Out-File evidence/result.txt -Encoding utf8 -Append
          'gate_b=PASS' | Out-File evidence/result.txt -Encoding utf8 -Append
          'gate_c_desktop_local_noauth=PASS' | Out-File evidence/result.txt -Encoding utf8 -Append
          'security_invariants=PASS' | Out-File evidence/result.txt -Encoding utf8 -Append
          'meaning=template PASS + deterministic worker E2E PASS + live public-web title-to-ID PASS + exact built Windows EXE CLI PASS + exact built Windows EXE authenticated API filename-to-ID PASS + exact built Windows EXE desktop-local protected API without setup/login/session/token PASS + non-desktop auth remains fail-closed + all tested/distributed EXE SHA256 identity PASS' | Out-File evidence/result.txt -Encoding utf8 -Append
          'distribution_eligible=true' | Out-File evidence/result.txt -Encoding utf8 -Append

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Javinizer-KEEPWORDS-Windows
          path: dist/Javinizer-KEEPWORDS.exe
          if-no-files-found: error
          retention-days: 14

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Javinizer-KEEPWORDS-verification-evidence
          path: evidence/
          if-no-files-found: warn
          retention-days: 14