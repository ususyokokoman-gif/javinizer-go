<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JAVINIZER</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main id="main">
 <div class="settings">
    <h1>JAVINIZER</h1>
    <p class="lead">動画フォルダを選んで開始するだけです。確定できないファイルは自動整理の対象にしません。</p>

    <section>
      <label>動画フォルダ</label>
      <div class="row">
        <input id="root" readonly placeholder="フォルダを選択してください" />
        <button id="chooseRoot">選択</button>
      </div>
    </section>

    <section id="apiSection">
      <label>TypeSafe APIキー <span>（初回のみ）</span></label>
      <input id="apiKey" type="password" autocomplete="off" placeholder="保存済みの場合は空欄でOK" />
      <small>APIキーはこのPCのユーザー専用に安全に保存します。</small>
    </section>

    <details>
      <summary>保存先</summary>
      <div class="row">
        <input id="outDir" readonly />
        <button id="chooseOut">変更</button>
      </div>
    </details>

    <div class="actions">
 <button id="start" class="primary">開始</button>
    <button id="cancel" class="danger" disabled>キャンセル</button>
    <button id="openResults" class="secondary">結果フォルダを開く</button>

    </div></div>
    <div id="status" role="status" aria-live="polite">準備完了</div>
    <div id="runSummary" hidden></div>
    <section class="logs" aria-label="処理ログ">
      <div class="toolbar">
        <strong>処理の状況</strong>
        <button id="expandLog">ログを拡大</button>
        <button id="pauseLog">表示を一時停止</button>
        <button id="copyLog">ログをコピー</button>
        <label><input id="autoScroll" type="checkbox" checked />自動スクロール</label>
      </div>
      <pre id="log" tabindex="0" aria-label="日本語の処理ログ"></pre>
      <details id="technicalDetails">
        <summary>詳細ログ（技術情報）</summary>
        <small>画面には最新10,000行を表示します。全件は結果フォルダの run.log に保存します。</small>
        <pre id="technicalLog" tabindex="0" aria-label="詳細ログ"></pre>
      </details>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
